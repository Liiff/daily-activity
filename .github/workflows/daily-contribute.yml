name: Auto Contribution

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-file:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil isi repositori
        uses: actions/checkout@v4

      - name: Update file log dan commit
        run: |
          git config user.name "Liiff"
          git config user.email "256220180+Liiff@users.noreply.github.com"
          git pull --rebase
          date > activity.log
          git add activity.log
          git commit -m "Update log harian"
          git push
